spring.application.name=career-prep-ai

server.port=${PORT:8080}

# MySQL Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/career_prep_ai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Resume upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

resume.upload-dir=${RESUME_UPLOAD_DIR:uploads/resumes}

# JWT Configuration
jwt.secret=${JWT_SECRET:change-this-local-secret-before-production}